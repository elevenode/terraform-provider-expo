name: Nightly

# Scheduled canary run of the same tests as test.yaml. Kept in a separate
# file (no pull_request trigger) so that GitHub's inactivity auto-disable of
# scheduled workflows can never take the PR checks down with it.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

jobs:
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Run tests
        run: go test ./internal/... -count=1 -cover

  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      IMMUTABLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.IMMUTABLE_PROVISIONING_PROFILE_BASE64 }}
      FCM_KEY: ${{ secrets.FCM_KEY }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Run tests
        run: go test ./test/... -count=1 -cover
